kind: pipeline
type: kubernetes
name: default

steps:
  - name: build and push docker image
    image: plugins/kaniko
    settings:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
      repo: ${REGISTRY}/test
      tags:
        - latest
      dockerfile: ./project/Dockerfile # Dockerfile 경로 (커스텀 지정 가능)
      context: ./project # 빌드 컨텍스트 (일반적으로 현재 디렉토리)
      cache: true # 캐시 활성화
      cache_repo: ${REGISTRY}/test/cache # 캐시 저장소 지정
