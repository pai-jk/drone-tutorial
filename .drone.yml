---
kind: pipeline
type: kubernetes
name: dev-merge-request

trigger:
  event: [pull_request]
  branch: # PR의 target 브랜치를 평가
    - dev

steps:
  - name: validate-merge-request
    image: python:3.13-alpine
    commands:
      - echo "✅ Merge Request to dev detected"
      - apk add --no-cache git bash coreutils
      - chmod +x scripts/lint.sh scripts/test.sh
      - ./scripts/lint.sh
      - ./scripts/test.sh

---
kind: pipeline
type: kubernetes
name: dev-push

trigger:
  branch:
    - dev
  event:
    - push

steps:
  - name: set-vars
    image: alpine:3.20
    commands:
      - |
        set -e
        apk add --no-cache coreutils
        SHORT_SHA="$(printf "%s" "${DRONE_COMMIT_SHA}" | cut -c1-7)"
        VERSION="$(tr -d '\n' < VERSION || true)"
        {
          echo "SHORT_SHA=${SHORT_SHA}"
          echo "VERSION=${VERSION}"
        } > .ci_env
        cat .ci_env

  - name: set-vars2
    image: alpine:3.20
    commands:
      - apk add --no-cache coreutils
      - printf "SHORT_SHA=%s\n" "$(printf "%s" "${DRONE_COMMIT_SHA}" | cut -c1-7)" > .ci_env
      - printf "VERSION=%s\n" "$(tr -d '\n' < VERSION || echo '0.0.0')" >> .ci_env
      - cat .ci_env

  - name: build-and-push
    image: gcr.io/kaniko-project/executor:latest
    # kaniko 이미지는 기본 entrypoint가 executor 이므로, 쉘 로직을 쓰기 위해 entrypoint 지정
    entrypoint:
      - /busybox/sh
      - -c
    environment:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
    commands:
      - source .ci_env
      # Docker credential 생성
      - mkdir -p /kaniko/.docker
      - >
        cat > /kaniko/.docker/config.json <<'JSON'
        {
          "auths": {
            "${REGISTRY}": {
              "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64 -w0)"
            }
          }
        }
        JSON
      # DEV 태그: <VERSION>-dev-<shortsha>
      - >
        /kaniko/executor
        --context "${DRONE_WORKSPACE}"
        --dockerfile "${DRONE_WORKSPACE}/Dockerfile"
        --destination "${REGISTRY}/${DRONE_REPO}:$VERSION-dev-$SHORT_SHA"
        --oci-layout-path /kaniko/oci
        --skip-tls-verify
        --reproducible
      - echo "Pushed ${REGISTRY}/${DRONE_REPO}:$VERSION-dev-$SHORT_SHA"

  # (선택) 이미지 스캔
  - name: trivy-scan
    image: aquasec/trivy:latest
    commands:
      - source .ci_env
      - trivy image --exit-code 0 --severity HIGH,CRITICAL "${REGISTRY}/${DRONE_REPO}:$VERSION-dev-$SHORT_SHA"

---
kind: pipeline
type: kubernetes
name: main-push

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: set-vars
    image: alpine:3.20
    commands:
      - apk add --no-cache coreutils
      - SHORT_SHA=$(printf "%s" "${DRONE_COMMIT_SHA}" | cut -c1-7)
      - VERSION=$(tr -d '\n' < VERSION)
      - echo "SHORT_SHA=${SHORT_SHA}"   >> .ci_env
      - echo "VERSION=${VERSION}"       >> .ci_env
      - cat .ci_env

  - name: build-and-push
    image: gcr.io/kaniko-project/executor:latest
    entrypoint:
      - /busybox/sh
      - -c
    environment:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
    commands:
      - source .ci_env
      - mkdir -p /kaniko/.docker
      - >
        cat > /kaniko/.docker/config.json <<'JSON'
        {
          "auths": {
            "${REGISTRY}": {
              "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64 -w0)"
            }
          }
        }
        JSON
      # PROD 태그: <VERSION> 와 latest 동시 태깅
      - >
        /kaniko/executor
        --context "${DRONE_WORKSPACE}"
        --dockerfile "${DRONE_WORKSPACE}/Dockerfile"
        --destination "${REGISTRY}/${DRONE_REPO}:$VERSION"
        --destination "${REGISTRY}/${DRONE_REPO}:latest"
        --skip-tls-verify
        --reproducible
      - echo "Pushed ${REGISTRY}/${DRONE_REPO}:$VERSION and :latest"
