---
kind: pipeline
type: kubernetes
name: dev-merge-request

trigger:
  event: [pull_request]
  branch: # PR의 target 브랜치를 평가
    - dev

steps:
  - name: validate-merge-request
    image: python:3.13-alpine
    commands:
      - echo "✅ Merge Request to dev detected"
      - apk add --no-cache git bash coreutils
      - chmod +x scripts/lint.sh scripts/test.sh
      - ./scripts/lint.sh
      - ./scripts/test.sh

---
kind: pipeline
type: kubernetes
name: dev-push

trigger:
  branch:
    - dev
  event:
    - push

steps:
  - name: clone
    image: alpine/git:v2.40.1
    commands:
      - echo "📦 Cloning repository..."

  - name: set-vars
    image: alpine:3.20
    commands:
      - apk add --no-cache coreutils
      - SHORT_SHA=$(printf "%s" "${DRONE_COMMIT_SHA}" | cut -c1-7)
      - VERSION=$(tr -d '\n' < VERSION || echo '0.0.0')
      - echo "SHORT_SHA=${SHORT_SHA}" | tee -a .ci_env
      - echo "VERSION=${VERSION}" | tee -a .ci_env
      - echo "REGISTRY=${REGISTRY}" | tee -a .ci_env
      - echo "DRONE_REPO=${DRONE_REPO}" | tee -a .ci_env
      - echo "📋 Build variables:"
      - cat .ci_env
    environment:
      REGISTRY:
        from_secret: REGISTRY

  - name: build-and-push
    image: gcr.io/kaniko-project/executor:v1.23.2
    environment:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
    commands:
      # 환경 변수 로드
      - source .ci_env
      - echo "🔧 Setting up Docker credentials..."
      # Docker credential 생성
      - mkdir -p /kaniko/.docker
      - AUTH_STRING=$(echo -n "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" | base64 | tr -d '\n')
      - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${AUTH_STRING}\"}}}" > /kaniko/.docker/config.json
      - echo "✅ Docker config created"
      - cat /kaniko/.docker/config.json
      # 빌드 실행
      - echo "🏗️ Building and pushing image..."
      - |
        /kaniko/executor \
          --context "${DRONE_WORKSPACE}" \
          --dockerfile "${DRONE_WORKSPACE}/Dockerfile" \
          --destination "${REGISTRY}/${DRONE_REPO}:${VERSION}-dev-${SHORT_SHA}" \
          --cache=true \
          --cache-ttl=24h \
          --reproducible \
          --single-snapshot \
          --use-new-run \
          --verbosity=info
      - echo "✅ Successfully pushed ${REGISTRY}/${DRONE_REPO}:${VERSION}-dev-${SHORT_SHA}"

---
kind: pipeline
type: kubernetes
name: main-push

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: clone
    image: alpine/git:v2.40.1
    commands:
      - echo "📦 Cloning repository..."

  - name: set-vars
    image: alpine:3.20
    commands:
      - apk add --no-cache coreutils
      - SHORT_SHA=$(printf "%s" "${DRONE_COMMIT_SHA}" | cut -c1-7)
      - VERSION=$(tr -d '\n' < VERSION || echo '0.0.0')
      - echo "SHORT_SHA=${SHORT_SHA}" | tee -a .ci_env
      - echo "VERSION=${VERSION}" | tee -a .ci_env
      - echo "REGISTRY=${REGISTRY}" | tee -a .ci_env
      - echo "DRONE_REPO=${DRONE_REPO}" | tee -a .ci_env
      - echo "📋 Build variables:"
      - cat .ci_env
    environment:
      REGISTRY:
        from_secret: REGISTRY

  - name: build-and-push
    image: gcr.io/kaniko-project/executor:v1.23.2
    environment:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
    commands:
      # 환경 변수 로드
      - source .ci_env
      - echo "🔧 Setting up Docker credentials..."
      # Docker credential 생성
      - mkdir -p /kaniko/.docker
      - AUTH_STRING=$(echo -n "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" | base64 | tr -d '\n')
      - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${AUTH_STRING}\"}}}" > /kaniko/.docker/config.json
      - echo "✅ Docker config created"
      - cat /kaniko/.docker/config.json
      # 빌드 실행 (PROD 태그: VERSION과 latest 동시 태깅)
      - echo "🏗️ Building and pushing production images..."
      - |
        /kaniko/executor \
          --context "${DRONE_WORKSPACE}" \
          --dockerfile "${DRONE_WORKSPACE}/Dockerfile" \
          --destination "${REGISTRY}/${DRONE_REPO}:${VERSION}" \
          --destination "${REGISTRY}/${DRONE_REPO}:latest" \
          --cache=true \
          --cache-ttl=24h \
          --reproducible \
          --single-snapshot \
          --use-new-run \
          --verbosity=info
      - echo "✅ Successfully pushed ${REGISTRY}/${DRONE_REPO}:${VERSION} and ${REGISTRY}/${DRONE_REPO}:latest"
