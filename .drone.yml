---
kind: pipeline
type: kubernetes
name: dev-merge-request

trigger:
  event: [pull_request]
  branch:
    - dev

steps:
  - name: validate-merge-request
    image: python:3.13-alpine
    commands:
      - echo "Merge Request to dev detected"
      - apk add --no-cache git bash coreutils
      - chmod +x scripts/lint.sh scripts/test.sh
      - ./scripts/lint.sh
      - ./scripts/test.sh

---
kind: pipeline
type: kubernetes
name: default

steps:
  - name: print secrets # (디버깅용 step, 완료 후 지워야 함)
    image: alpine
    environment:
      registry:
        from_secret: REGISTRY
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
    commands:
      - echo $REGISTRY
      - echo $REGISTRY_USERNAME
      - echo $registry
      - echo $username
      - echo ${REGISTRY}
      - echo ${REGISTRY_USERNAME}

