---
kind: pipeline
type: kubernetes
name: dev-merge-request

trigger:
  event: [pull_request]
  branch:
    - dev

steps:
  - name: validate-merge-request
    image: python:3.13-alpine
    commands:
      - echo "Merge Request to dev detected"
      - apk add --no-cache git bash coreutils
      - chmod +x scripts/lint.sh scripts/test.sh
      - ./scripts/lint.sh
      - ./scripts/test.sh

---
kind: pipeline
type: kubernetes
name: default

steps:
  # # l0AVf3DaxsfWRGlY8FYO1hX9c6vI7geW
  - name: build and push container image
    image: plugins/kaniko:1.7.0
    settings:
      registry: harbor.pai-world.com
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      repo: harbor.pai-world.com/test/drone-tutorial
      tags:
        - latest
        - sha-${DRONE_COMMIT_SHA:0:7}
      dockerfile: ./project/Dockerfile
      cache: true
      cache_repo: harbor.pai-world.com/test/drone-tutorial/cache

---
kind: pipeline
type: kubernetes
name: release

# 태그로 트리거되는 릴리스 전용 파이프라인
trigger:
  event:
    - tag

steps:
  - name: build-push-release
    image: plugins/kaniko:1.7.0
    settings:
      registry: harbor.pai-world.com
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      repo: harbor.pai-world.com/test/drone-tutorial
      dockerfile: ./project/Dockerfile
      cache: true
      cache_repo: harbor.pai-world.com/test/drone-tutorial/cache
      # 태그에서 'v' 프리픽스 제거해 사용 (예: v1.2.3 -> 1.2.3)
      tags:
        - latest
        - ${DRONE_TAG#v}
